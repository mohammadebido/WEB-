<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تفاصيل الخبر</title>
  <link rel="stylesheet" href="moreinfo.css">
  </style>
</head>
<body>

  <div id="news-container">
    <h1>تحميل الخبر...</h1>
  </div>

  <br>
  <a href="index.html">← الرجوع إلى قائمة الأخبار</a>

  <div class="container">
    <script>
      const newsData = {
        news1: {
          title: "الصراع في الشرق الأوسط.. حماس وإسرائيل تواصلان القتال رغم الدعوات للتهدئة ",
            content: "تواصلت الاشتباكات بين حماس وإسرائيل في ظل تصاعد التوترات في المنطقة. ورغم الدعوات الدولية للتهدئة، لم يتم التوصل إلى اتفاق لوقف إطلاق النار. وأكدت مصادر محلية أن الأوضاع الإنسانية تتدهور بشكل كبير، حيث يعاني السكان من نقص في الإمدادات الأساسية. وتستمر الجهود الدبلوماسية من قبل الأمم المتحدة وعدد من الدول للتوصل إلى حل ينهي الأزمة الحالية.",
          image: "hamas.jpg"
        },
        news2: {
            title: "اجتماع دولي في الأمم المتحدة حول الأزمة الليبية",
            content: "عُقد اجتماع دولي في مقر الأمم المتحدة لمناقشة الأزمة الليبية. وشارك في الاجتماع ممثلون عن الدول الكبرى والمنظمات الدولية، حيث تم التركيز على أهمية التوصل إلى حل سياسي شامل. وأكد المشاركون على ضرورة وقف التدخلات الخارجية ودعم الحوار بين الأطراف الليبية لتحقيق الاستقرار في البلاد.",
          image: "img-0339369931.jpg"
        },
        news3: {
          title: "روسيا وأوكرانيا: تطورات جديدة على الجبهة الشرقية ",
            content: "تستمر الأزمة بين روسيا وأوكرانيا في التصاعد مع تطورات جديدة على الجبهة الشرقية. وقد أفادت التقارير بأن القوات الروسية قامت بشن هجمات مكثفة على مواقع أوكرانية، مما أدى إلى وقوع خسائر كبيرة في الأرواح والممتلكات. وفي المقابل، أعلنت أوكرانيا عن تحقيق تقدم في بعض المناطق، مؤكدة أنها لن تتراجع عن الدفاع عن سيادتها. وتأتي هذه التطورات في ظل جهود دولية متواصلة لتهدئة الأوضاع، حيث دعت الأمم المتحدة والعديد من الدول إلى وقف فوري لإطلاق النار وبدء مفاوضات جادة لإنهاء النزاع. ومع ذلك، لا تزال التوترات قائمة، مما يزيد من معاناة المدنيين الذين يواجهون أوضاعًا إنسانية صعبة بسبب النزاع المستمر.",
          image: "okrain.jpg"
        }
      };

     
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('post');

      const container = document.getElementById('news-container');

      if (postId && newsData[postId]) {
        container.innerHTML = `
          <h1>${newsData[postId].title}</h1>
          <img src="${newsData[postId].image}" alt="${newsData[postId].title}" style="max-width: 100%; height: auto;">
          <p>${newsData[postId].content}</p>
        `;
      } else {
        container.innerHTML = `<h1>الخبر غير موجود</h1><p>عذرًا، لا يوجد خبر بهذا الاسم.</p>`;
      }
    </script>
  </div>

</body>
</html>
