name: Deploy Alasali Order Page

on:
  push:
    branches: [main]
    paths:
      - 'alasali-order/**'
      - '.github/workflows/alasali-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alasali-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload order page
        uses: actions/upload-pages-artifact@v3
        with:
          path: alasali-order

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
